name: CI

on:
  push:
    branches: [main, 'sprint/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # URL factice pour prisma generate en CI (aucune connexion réelle)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test --if-present

  web:
    name: Web — typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Vérifie que le web existe
        id: check
        run: test -f package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Setup Node.js 24
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: TypeScript check
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint
