name: CI

on:
  push:
    branches: [main, 'sprint/**']
  pull_request:
    branches: [main]

# Force Node.js 24 pour les actions GitHub (supprime le warning de dépréciation Node 20)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend — typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test --if-present

  web:
    name: Web — typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Vérifie depuis la racine du repo — évite de cd dans un dossier inexistant
      - name: Vérifie que le web existe
        id: check
        run: test -f web/package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT

      - name: Setup Node.js 24
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm ci

      - name: TypeScript check
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run lint

  deploy:
    name: Deploy — Render (backend)
    runs-on: ubuntu-latest
    # Ne se déclenche que sur push vers main, après que les checks passent
    needs: [backend, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -f -X POST "$HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK not configured, skipping."
          fi
